<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel XV Emily</title>
<meta name="theme-color" content="#e8b9b0">
<meta property="og:type" content="website">
<meta property="og:title" content="Panel de invitados · XV Emily Victoria">
<meta property="og:description" content="Administra invitados, confirmaciones y mensajes.">
<meta property="og:image" content="https://jadeinkinvitacionesdigitales-source.github.io/xv-emily/invitacion-emily/assets/vista-previa.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="assets/vista-previa.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Ms+Madi&family=Tinos:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --tinta: #2a1a17;
  --suave: #6a5550;
  --rosa: #c9707e;
  --rosa-claro: #f5d6d3;
  --oro: #b98a52;
  --oro-claro: #e8c9a0;
  --crema: #fff8f3;
  --si: #3f7d58;
  --no: #b0474f;
  --pend: #9a7a3c;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100svh;
  background: linear-gradient(170deg, #f7e1da 0%, #ecc3bb 55%, #e0a99f 100%) fixed;
  color: var(--tinta);
  font: 14px/1.6 "Libre Baskerville", Georgia, serif;
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
.script { font-family: "Ms Madi", cursive; font-weight: 400; -webkit-text-stroke: .3px currentColor; line-height: 1.05; margin: 0; }
.envoltura { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }

.tarjeta {
  background: rgba(255, 248, 243, .94);
  border: 1px solid var(--oro); outline: 1px solid var(--oro-claro); outline-offset: -5px;
  border-radius: 6px; box-shadow: 0 8px 26px rgba(130, 85, 60, .14);
  padding: 20px;
}

.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 16px;
  border: 1px solid var(--oro); border-radius: 999px;
  background: linear-gradient(180deg, #fff6ee, #f6d8d4);
  color: var(--tinta); font-weight: 700; font-size: 12.5px; text-decoration: none; cursor: pointer; white-space: nowrap;
}
.boton:hover { background: linear-gradient(180deg, #fff, #f5d6d3); }
.boton.primario { background: var(--rosa); border-color: var(--rosa); color: #fff; }
.boton.chico { min-height: 34px; padding: 5px 12px; font-size: 12px; }
.boton.peligro { color: var(--no); border-color: #d9a3a6; }
.boton:disabled { opacity: .6; cursor: wait; }
.boton svg { width: 15px; height: 15px; flex: none; }
:focus-visible { outline: 2px solid var(--rosa); outline-offset: 2px; }

label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a6036; margin-bottom: 4px; }
input, select {
  width: 100%; min-height: 42px; padding: 8px 12px;
  border: 1px solid var(--oro); border-radius: 6px; background: #fff; font-size: 16px;
}

/* Login */
.login { max-width: 380px; margin: 12svh auto 0; text-align: center; }
.login h1 { font-size: 52px; margin-bottom: 2px; }
.login p { color: var(--suave); margin: 0 0 16px; }
.login form { display: grid; gap: 12px; text-align: left; }
.aviso { font-size: 13px; font-weight: 700; color: var(--no); min-height: 1.2em; margin: 0; text-align: center; }

/* Cabecera */
.cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.cabecera h1 { font-size: 44px; }
.cabecera .sub { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #8a6036; margin: 0; }
.cabecera .acciones { display: flex; gap: 8px; flex-wrap: wrap; }

/* Resumen */
.resumen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.cifra { padding: 14px 12px; text-align: center; }
.cifra b { display: block; font-family: Tinos, serif; font-size: 34px; line-height: 1.1; color: var(--rosa); font-variant-numeric: tabular-nums; }
.cifra span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8a6036; font-weight: 700; }
.cifra small { display: block; color: var(--suave); font-size: 11.5px; }
.cifra.si b { color: var(--si); }
.cifra.no b { color: var(--no); }
.cifra.pend b { color: var(--pend); }
.barra { height: 8px; border-radius: 99px; background: #f1e1dc; overflow: hidden; display: flex; margin: 0 0 16px; }
.barra i { display: block; height: 100%; }

/* Pestañas */
.pestanas { display: flex; gap: 6px; margin-bottom: 12px; }
.pestanas button {
  flex: 1; min-height: 42px; border: 1px solid var(--oro); border-radius: 6px;
  background: rgba(255,248,243,.7); font-weight: 700; cursor: pointer;
}
.pestanas button[aria-selected="true"] { background: var(--crema); box-shadow: inset 0 -3px 0 var(--rosa); }

/* Agregar */
.agregar { display: grid; grid-template-columns: 2fr 90px 1.2fr auto; gap: 10px; align-items: end; margin-bottom: 14px; }
.agregar h2 { grid-column: 1 / -1; margin: 0; font-size: 15px; }
.nuevo-enlace { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 6px; background: #f3e7dc; font-size: 13px; }
.nuevo-enlace code { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 12px; }

.filtros { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filtros input { flex: 1 1 200px; }
.filtros select { flex: 0 0 170px; }

/* Lista */
.lista { display: grid; gap: 10px; }
.invitado { padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.invitado h3 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.invitado .meta { color: var(--suave); font-size: 12.5px; }
.invitado .meta code { font-size: 12px; letter-spacing: .08em; }
.invitado .botones { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.estado { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 700; white-space: nowrap; border: 1px solid currentColor; }
.estado.si { color: var(--si); background: #e8f3ec; }
.estado.no { color: var(--no); background: #f8e6e7; }
.estado.pend { color: var(--pend); background: #f6efe0; }
.vacio { text-align: center; color: var(--suave); padding: 30px 16px; }

.mensaje { padding: 16px; }
.mensaje header { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
.mensaje h3 { margin: 0; font-size: 15px; }
.mensaje time { font-size: 12px; color: var(--suave); }
.mensaje p { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--suave); font-style: italic; }

dialog { border: 0; padding: 0; background: none; width: min(420px, 92vw); }
dialog::backdrop { background: rgba(40, 22, 20, .55); }
dialog form { display: grid; gap: 12px; }
dialog h2 { margin: 0; font-size: 34px; }
dialog .fila { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--tinta); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 50; max-width: 92vw; text-align: center;
}

@media (max-width: 620px) {
  .resumen { grid-template-columns: repeat(2, 1fr); }
  .agregar { grid-template-columns: 1fr 90px; }
  .agregar .tel { grid-column: 1 / -1; }
  .agregar .boton { grid-column: 1 / -1; }
  .filtros select { flex: 1 1 100%; }
  .cabecera h1 { font-size: 38px; }
}
</style>
</head>
<body>

<!-- Acceso -->
<section class="envoltura" id="vista-login">
  <div class="tarjeta login">
    <h1 class="script">Panel</h1>
    <p>XV Años de Emily Victoria</p>
    <form id="form-login">
      <div>
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" required>
      </div>
      <button class="boton primario" type="submit">Entrar</button>
      <p class="aviso" id="login-aviso" role="status"></p>
    </form>
  </div>
</section>

<!-- Panel -->
<section class="envoltura" id="vista-panel" hidden>
  <header class="cabecera">
    <div>
      <p class="sub">XV Años · 26 dic 2026</p>
      <h1 class="script">Emily Victoria</h1>
    </div>
    <div class="acciones">
      <button class="boton chico" id="btn-actualizar" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Actualizar</button>
      <button class="boton chico" id="btn-csv" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M4 19h16"/></svg>Descargar lista</button>
      <a class="boton chico" id="btn-ver" target="_blank" rel="noopener">Ver invitación</a>
      <button class="boton chico" id="btn-salir" type="button">Salir</button>
    </div>
  </header>

  <div class="resumen">
    <div class="tarjeta cifra"><b id="r-invitaciones">0</b><span>Invitaciones</span><small><span id="r-puestos">0</span> puestos</small></div>
    <div class="tarjeta cifra si"><b id="r-si">0</b><span>Asistirán</span><small>puestos confirmados</small></div>
    <div class="tarjeta cifra no"><b id="r-no">0</b><span>No asistirán</span><small>puestos</small></div>
    <div class="tarjeta cifra pend"><b id="r-pend">0</b><span>Pendientes</span><small>puestos sin responder</small></div>
  </div>
  <div class="barra" id="barra" aria-hidden="true"></div>

  <div class="pestanas" role="tablist">
    <button type="button" role="tab" aria-selected="true" aria-controls="tab-invitados" id="t-invitados">Invitados</button>
    <button type="button" role="tab" aria-selected="false" aria-controls="tab-mensajes" id="t-mensajes">Mensajes (<span id="n-mensajes">0</span>)</button>
  </div>

  <div id="tab-invitados" role="tabpanel">
    <form class="tarjeta agregar" id="form-agregar">
      <h2>Agregar invitado</h2>
      <div>
        <label for="a-nombre">Nombre o familia</label>
        <input id="a-nombre" maxlength="80" required placeholder="Familia Pérez">
      </div>
      <div>
        <label for="a-puestos">Puestos</label>
        <input id="a-puestos" type="number" min="1" max="99" value="2" required>
      </div>
      <div class="tel">
        <label for="a-tel">WhatsApp (opcional)</label>
        <input id="a-tel" type="tel" maxlength="20" placeholder="6000-0000">
      </div>
      <button class="boton primario" type="submit">Agregar</button>
      <div class="nuevo-enlace" id="nuevo-enlace" hidden></div>
    </form>

    <div class="filtros">
      <input id="buscar" type="search" placeholder="Buscar invitado…" aria-label="Buscar invitado">
      <select id="filtro" aria-label="Filtrar por respuesta">
        <option value="">Todas las respuestas</option>
        <option value="Sí">Asistirán</option>
        <option value="No">No asistirán</option>
        <option value="pend">Pendientes</option>
      </select>
    </div>
    <div class="lista" id="lista"></div>
  </div>

  <div id="tab-mensajes" role="tabpanel" hidden>
    <div class="lista" id="lista-mensajes"></div>
  </div>
</section>

<dialog id="dlg-editar">
  <form class="tarjeta" method="dialog" id="form-editar">
    <h2 class="script">Editar invitado</h2>
    <div><label for="e-nombre">Nombre o familia</label><input id="e-nombre" maxlength="80" required></div>
    <div><label for="e-puestos">Puestos</label><input id="e-puestos" type="number" min="1" max="99" required></div>
    <div><label for="e-tel">WhatsApp</label><input id="e-tel" type="tel" maxlength="20"></div>
    <div>
      <label for="e-resp">Respuesta</label>
      <select id="e-resp"><option value="">Pendiente</option><option>Sí</option><option>No</option></select>
    </div>
    <div class="fila">
      <button class="boton" type="button" id="e-cancelar">Cancelar</button>
      <button class="boton primario" type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<p class="toast" id="toast" role="status" hidden></p>

<script src="assets/config.js?v=3"></script>
<script>
var API = window.INVITACION && window.INVITACION.api;
var QUINCEANERA = 'Emily Victoria';
var BASE = new URL('./', location.href).href;
var clave = '';
try { clave = sessionStorage.getItem('panel-clave') || ''; } catch (e) {}
var datos = { invitados: [], mensajes: [] };
var editando = null;

function $(id) { return document.getElementById(id); }
function aviso(t) {
  var el = $('toast'); el.textContent = t; el.hidden = false;
  clearTimeout(aviso.t); aviso.t = setTimeout(function () { el.hidden = true; }, 2600);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function llamar(datosPost) {
  datosPost.clave = clave;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(datosPost) })
    .then(function (r) { return r.json(); })
    .then(function (r) {
      if (!r.ok && r.error === 'clave') { salir(); throw new Error('clave'); }
      if (!r.ok) throw new Error(r.error || 'error');
      return r;
    });
}

function enlace(codigo) { return BASE + '?i=' + codigo; }
function telefonoWa(t) {
  var d = String(t || '').replace(/\D/g, '');
  if (d.length === 8) d = '507' + d;
  return d;
}
function textoInvitacion(inv) {
  return 'Hola ' + inv.nombre + ', con mucho cariño te invitamos a celebrar los XV años de ' + QUINCEANERA +
    '. Tenemos ' + inv.puestos + (Number(inv.puestos) === 1 ? ' puesto reservado' : ' puestos reservados') +
    ' para ustedes. Mira la invitación y confirma tu asistencia aquí:\n' + enlace(inv.codigo);
}

/* ---------- Acceso ---------- */
$('btn-ver').href = BASE;
$('form-login').addEventListener('submit', function (e) {
  e.preventDefault();
  if (!API) { $('login-aviso').textContent = 'Falta la URL de Apps Script en assets/config.js.'; return; }
  clave = $('clave').value;
  $('login-aviso').textContent = 'Entrando…';
  cargar().then(function () {
    try { sessionStorage.setItem('panel-clave', clave); } catch (e) {}
    $('login-aviso').textContent = '';
  }).catch(function (err) {
    $('login-aviso').textContent = err.message === 'clave' ? 'Contraseña incorrecta.' :
      /fetch|network|load/i.test(err.message) ? 'No se pudo conectar con Google. Revisa tu internet e inténtalo de nuevo.' :
      'Error de la hoja de Google: ' + err.message;
  });
});
function salir() {
  clave = '';
  try { sessionStorage.removeItem('panel-clave'); } catch (e) {}
  $('vista-panel').hidden = true; $('vista-login').hidden = false;
}
$('btn-salir').addEventListener('click', salir);

function cargar() {
  return llamar({ accion: 'listar' }).then(function (r) {
    datos.invitados = r.invitados || [];
    datos.mensajes = (r.mensajes || []).slice().reverse();
    $('vista-login').hidden = true; $('vista-panel').hidden = false;
    pintar();
  });
}
$('btn-actualizar').addEventListener('click', function () {
  cargar().then(function () { aviso('Lista actualizada'); }).catch(function () { aviso('No se pudo actualizar'); });
});

/* ---------- Pintar ---------- */
function pintar() {
  var inv = datos.invitados, tot = 0, si = 0, no = 0, pend = 0;
  inv.forEach(function (i) {
    var p = Number(i.puestos) || 0; tot += p;
    if (i.respuesta === 'Sí') si += p; else if (i.respuesta === 'No') no += p; else pend += p;
  });
  $('r-invitaciones').textContent = inv.length;
  $('r-puestos').textContent = tot;
  $('r-si').textContent = si; $('r-no').textContent = no; $('r-pend').textContent = pend;
  var b = tot || 1;
  $('barra').innerHTML = '<i style="width:' + (si / b * 100) + '%;background:var(--si)"></i>' +
    '<i style="width:' + (no / b * 100) + '%;background:var(--no)"></i>' +
    '<i style="width:' + (pend / b * 100) + '%;background:var(--oro-claro)"></i>';
  $('n-mensajes').textContent = datos.mensajes.length;
  pintarLista();
  pintarMensajes();
}

function pintarLista() {
  var q = $('buscar').value.trim().toLowerCase(), f = $('filtro').value;
  var lista = datos.invitados.filter(function (i) {
    if (q && String(i.nombre).toLowerCase().indexOf(q) < 0 && String(i.codigo).toLowerCase().indexOf(q) < 0) return false;
    if (f === 'pend') return !i.respuesta;
    if (f) return i.respuesta === f;
    return true;
  });
  if (!lista.length) {
    $('lista').innerHTML = '<div class="tarjeta vacio">' + (datos.invitados.length ? 'Ningún invitado coincide.' : 'Aún no hay invitados. Agrega el primero arriba.') + '</div>';
    return;
  }
  $('lista').innerHTML = lista.map(function (i) {
    var est = i.respuesta === 'Sí' ? '<span class="estado si">Asistirá</span>' :
      i.respuesta === 'No' ? '<span class="estado no">No asistirá</span>' : '<span class="estado pend">Pendiente</span>';
    var p = Number(i.puestos) || 0;
    return '<article class="tarjeta invitado" data-codigo="' + esc(i.codigo) + '">' +
      '<div><h3>' + esc(i.nombre) + '</h3><div class="meta">' + p + (p === 1 ? ' puesto' : ' puestos') +
      ' · <code>' + esc(i.codigo) + '</code>' + (i.telefono ? ' · ' + esc(i.telefono) : '') + '</div></div>' + est +
      '<div class="botones">' +
        '<button class="boton chico" type="button" data-accion="copiar">Copiar enlace</button>' +
        '<button class="boton chico" type="button" data-accion="whatsapp">Enviar por WhatsApp</button>' +
        '<button class="boton chico" type="button" data-accion="editar">Editar</button>' +
        '<button class="boton chico peligro" type="button" data-accion="eliminar">Eliminar</button>' +
      '</div></article>';
  }).join('');
}

function pintarMensajes() {
  if (!datos.mensajes.length) { $('lista-mensajes').innerHTML = '<div class="tarjeta vacio">Todavía no hay mensajes para Emily.</div>'; return; }
  $('lista-mensajes').innerHTML = datos.mensajes.map(function (m) {
    var fecha = m.fecha ? new Date(m.fecha).toLocaleString('es-PA', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    return '<article class="tarjeta mensaje" data-fila="' + esc(m._fila) + '"><header><h3>' + esc(m.nombre) + '</h3><time>' + esc(fecha) + '</time></header>' +
      '<p>' + esc(m.mensaje) + '</p><button class="boton chico peligro" type="button" data-accion="borrar-msg">Eliminar</button></article>';
  }).join('');
}

$('buscar').addEventListener('input', pintarLista);
$('filtro').addEventListener('change', pintarLista);

/* ---------- Pestañas ---------- */
['invitados', 'mensajes'].forEach(function (n) {
  $('t-' + n).addEventListener('click', function () {
    ['invitados', 'mensajes'].forEach(function (m) {
      $('t-' + m).setAttribute('aria-selected', m === n ? 'true' : 'false');
      $('tab-' + m).hidden = m !== n;
    });
  });
});

/* ---------- Copiar ---------- */
function copiar(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
  document.execCommand('copy'); a.remove(); return Promise.resolve();
}

/* ---------- Agregar ---------- */
$('form-agregar').addEventListener('submit', function (e) {
  e.preventDefault();
  var boton = e.target.querySelector('button[type=submit]');
  var nuevo = { nombre: $('a-nombre').value.trim(), puestos: Number($('a-puestos').value) || 1, telefono: $('a-tel').value.trim() };
  boton.disabled = true;
  llamar({ accion: 'agregar', nombre: nuevo.nombre, puestos: nuevo.puestos, telefono: nuevo.telefono })
    .then(function (r) {
      nuevo.codigo = r.codigo; nuevo.respuesta = '';
      datos.invitados.push(nuevo);
      pintar();
      var caja = $('nuevo-enlace');
      caja.innerHTML = '<span>Enlace de <b>' + esc(nuevo.nombre) + '</b>:</span><code>' + esc(enlace(r.codigo)) + '</code>' +
        '<button class="boton chico" type="button" data-accion="copiar" data-codigo="' + r.codigo + '">Copiar</button>' +
        '<button class="boton chico" type="button" data-accion="whatsapp" data-codigo="' + r.codigo + '">WhatsApp</button>';
      caja.hidden = false;
      e.target.reset(); $('a-puestos').value = 2; $('a-nombre').focus();
      aviso('Invitado agregado');
    })
    .catch(function () { aviso('No se pudo agregar'); })
    .then(function () { boton.disabled = false; });
});

/* ---------- Acciones por invitado ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-accion]');
  if (!b) return;
  var accion = b.dataset.accion;
  if (accion === 'borrar-msg') {
    var art = b.closest('[data-fila]');
    if (!confirm('¿Eliminar este mensaje? No se puede deshacer.')) return;
    llamar({ accion: 'borrarMensaje', fila: Number(art.dataset.fila) })
      .then(cargar).then(function () { aviso('Mensaje eliminado'); })
      .catch(function () { aviso('No se pudo eliminar'); });
    return;
  }
  var codigo = b.dataset.codigo || (b.closest('[data-codigo]') || {}).dataset.codigo;
  var inv = datos.invitados.filter(function (i) { return String(i.codigo) === codigo; })[0];
  if (!inv) return;

  if (accion === 'copiar') {
    copiar(textoInvitacion(inv)).then(function () { aviso('Invitación copiada'); });
  } else if (accion === 'whatsapp') {
    var tel = telefonoWa(inv.telefono);
    window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(textoInvitacion(inv)), '_blank', 'noopener');
  } else if (accion === 'editar') {
    editando = inv;
    $('e-nombre').value = inv.nombre; $('e-puestos').value = inv.puestos;
    $('e-tel').value = inv.telefono || ''; $('e-resp').value = inv.respuesta || '';
    $('dlg-editar').showModal();
  } else if (accion === 'eliminar') {
    if (!confirm('¿Eliminar a ' + inv.nombre + '? Su enlace dejará de funcionar.')) return;
    llamar({ accion: 'eliminar', codigo: inv.codigo })
      .then(cargar).then(function () { aviso('Invitado eliminado'); })
      .catch(function () { aviso('No se pudo eliminar'); });
  }
});

$('e-cancelar').addEventListener('click', function () { $('dlg-editar').close(); });
$('form-editar').addEventListener('submit', function (e) {
  e.preventDefault();
  var cambios = { accion: 'editar', codigo: editando.codigo, nombre: $('e-nombre').value.trim(),
    puestos: Number($('e-puestos').value) || 1, telefono: $('e-tel').value.trim(), respuesta: $('e-resp').value };
  llamar(cambios).then(function () {
    editando.nombre = cambios.nombre; editando.puestos = cambios.puestos;
    editando.telefono = cambios.telefono; editando.respuesta = cambios.respuesta;
    $('dlg-editar').close(); pintar(); aviso('Cambios guardados');
  }).catch(function () { aviso('No se pudo guardar'); });
});

/* ---------- CSV ---------- */
$('btn-csv').addEventListener('click', function () {
  var filas = [['Nombre', 'Puestos', 'WhatsApp', 'Respuesta', 'Código', 'Enlace']].concat(datos.invitados.map(function (i) {
    return [i.nombre, i.puestos, i.telefono || '', i.respuesta || 'Pendiente', i.codigo, enlace(i.codigo)];
  }));
  var csv = '﻿' + filas.map(function (f) {
    return f.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'invitados-xv-emily.csv';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
});

/* Entrar directo si ya había sesión */
if (API && clave) cargar().catch(function () { salir(); });
</script>
